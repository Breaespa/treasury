<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Entries - Demo Platform</title>
  <link rel="icon" href="/images/icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center">
        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center mr-3">
          <span class="text-white font-bold text-xl">DP</span>
        </div>
        <div>
          <h1 class="text-xl font-semibold text-gray-900">Manage Entries</h1>
          <p class="text-sm text-gray-500">Demo Platform Administration</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span id="welcomeUser" class="text-sm text-gray-600"></span>
        <button id="logoutBtn" class="text-sm text-red-600 hover:text-red-800">Logout</button>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex gap-6">
        <a href="/admin/dashboard.html" class="py-3 text-sm font-medium text-gray-600 hover:text-gray-900">Dashboard</a>
        <a href="/admin/entries.html" class="py-3 text-sm font-medium text-blue-600 border-b-2 border-blue-600">Entries</a>
        <a href="/admin/audit-logs.html" class="py-3 text-sm font-medium text-gray-600 hover:text-gray-900">Audit Logs</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    <!-- Search and Filter -->
    <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-200 mb-6">
      <div class="flex flex-wrap items-end gap-4">
        <div class="flex-1 min-w-64">
          <label class="block text-sm font-medium text-gray-700 mb-1">Search</label>
          <input
            type="text"
            id="searchInput"
            placeholder="Search by name, email, or reference..."
            class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
          <select id="statusFilter" class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">All Status</option>
            <option value="Paid">Paid</option>
            <option value="Pending">Pending</option>
            <option value="Overdue">Overdue</option>
          </select>
        </div>
        <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm transition-colors">
          Search
        </button>
        <button id="createBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm transition-colors">
          Create Entry
        </button>
      </div>
    </div>

    <!-- Entries Table -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="p-3 text-left font-medium">ID</th>
              <th class="p-3 text-left font-medium">Reference</th>
              <th class="p-3 text-left font-medium">Name</th>
              <th class="p-3 text-left font-medium">Email</th>
              <th class="p-3 text-left font-medium">Status</th>
              <th class="p-3 text-left font-medium">Amount</th>
              <th class="p-3 text-left font-medium">Actions</th>
            </tr>
          </thead>
          <tbody id="entriesTable">
            <!-- Entries will be loaded here -->
          </tbody>
        </table>
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="text-center py-12 hidden">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        <p class="text-sm text-gray-500 mt-2">Loading entries...</p>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="text-center py-12 hidden">
        <p class="text-sm text-gray-500">No entries found.</p>
      </div>

      <!-- Pagination -->
      <div id="pagination" class="px-6 py-4 border-t border-gray-200 flex items-center justify-between hidden">
        <span id="pageInfo" class="text-sm text-gray-600"></span>
        <div class="flex gap-2">
          <button id="prevPage" class="px-4 py-2 border border-gray-300 rounded text-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
            Previous
          </button>
          <button id="nextPage" class="px-4 py-2 border border-gray-300 rounded text-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
            Next
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit/Create Modal -->
  <div id="entryModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b border-gray-200">
        <h2 id="modalTitle" class="text-xl font-semibold text-gray-900">Create Entry</h2>
      </div>
      <form id="entryForm" class="p-6 space-y-4">
        <input type="hidden" id="entryId">
        <div class="grid grid-cols-2 gap-4">
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
            <input type="text" id="entryName" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="entryEmail" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Current Status</label>
            <select id="entryStatus" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="Pending">Pending</option>
              <option value="Paid">Paid</option>
              <option value="Overdue">Overdue</option>
            </select>
          </div>
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
            <textarea id="entryAddress" rows="2" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Transaction Status</label>
            <select id="transactionStatus" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="Pending">Pending</option>
              <option value="Processing">Processing</option>
              <option value="Completed">Completed</option>
              <option value="On Hold">On Hold</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Amount</label>
            <input type="number" step="0.01" id="entryAmount" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Currency</label>
            <input type="text" id="entryCurrency" value="USD" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fee</label>
            <input type="number" step="0.01" id="entryFee" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Remarks</label>
            <textarea id="entryRemarks" rows="2" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Profile Image</label>
            <input type="file" id="entryImage" accept="image/*" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <p id="currentImage" class="text-xs text-gray-500 mt-1"></p>
          </div>
        </div>
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" id="cancelBtn" class="px-4 py-2 border border-gray-300 rounded text-sm hover:bg-gray-50">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // State
    let currentPage = 1;
    let totalPages = 1;
    let currentSearch = '';
    let currentStatus = '';
    let editingId = null;

    // DOM Elements
    const entriesTable = document.getElementById('entriesTable');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const pagination = document.getElementById('pagination');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const entryModal = document.getElementById('entryModal');
    const entryForm = document.getElementById('entryForm');

    // Check authentication
    async function checkAuth() {
      try {
        const response = await fetch('/api/admin/session');
        const data = await response.json();

        if (!data.authenticated) {
          window.location.href = '/admin/login.html';
          return false;
        }

        document.getElementById('welcomeUser').textContent = `Welcome, ${data.user.username}`;
        return true;
      } catch (error) {
        console.error('Auth check error:', error);
        window.location.href = '/admin/login.html';
        return false;
      }
    }

    // Load entries
    async function loadEntries() {
      entriesTable.innerHTML = '';
      loadingState.classList.remove('hidden');
      emptyState.classList.add('hidden');
      pagination.classList.add('hidden');

      try {
        const params = new URLSearchParams({
          page: currentPage,
          limit: 20
        });

        if (currentSearch) params.append('q', currentSearch);
        if (currentStatus) params.append('status', currentStatus);

        const response = await fetch(`/api/admin/entries?${params}`);
        const data = await response.json();

        loadingState.classList.add('hidden');

        if (data.entries.length === 0) {
          emptyState.classList.remove('hidden');
          return;
        }

        totalPages = data.pagination.totalPages;

        data.entries.forEach(entry => {
          const row = document.createElement('tr');
          row.className = 'border-t border-gray-200 hover:bg-gray-50';

          const statusClass = entry.current_status === 'Paid'
            ? 'bg-green-100 text-green-800'
            : entry.current_status === 'Pending'
            ? 'bg-yellow-100 text-yellow-800'
            : 'bg-red-100 text-red-800';

          row.innerHTML = `
            <td class="p-3">${entry.id}</td>
            <td class="p-3 font-mono text-xs">${escapeHtml(entry.reference_number)}</td>
            <td class="p-3 font-medium">${escapeHtml(entry.name)}</td>
            <td class="p-3">${escapeHtml(entry.email || '—')}</td>
            <td class="p-3"><span class="text-xs px-2 py-1 rounded ${statusClass}">${escapeHtml(entry.current_status)}</span></td>
            <td class="p-3">$${parseFloat(entry.illustrative_amount).toFixed(2)}</td>
            <td class="p-3">
              <button onclick="editEntry(${entry.id})" class="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
              <button onclick="deleteEntry(${entry.id})" class="text-red-600 hover:text-red-800">Delete</button>
            </td>
          `;

          entriesTable.appendChild(row);
        });

        if (totalPages > 1) {
          pagination.classList.remove('hidden');
          document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
          document.getElementById('prevPage').disabled = currentPage === 1;
          document.getElementById('nextPage').disabled = currentPage === totalPages;
        }
      } catch (error) {
        console.error('Error loading entries:', error);
        loadingState.classList.add('hidden');
        emptyState.innerHTML = '<p class="text-sm text-red-500">Error loading entries. Please try again.</p>';
        emptyState.classList.remove('hidden');
      }
    }

    // Search
    document.getElementById('searchBtn').addEventListener('click', () => {
      currentSearch = searchInput.value.trim();
      currentStatus = statusFilter.value;
      currentPage = 1;
      loadEntries();
    });

    // Pagination
    document.getElementById('prevPage').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        loadEntries();
      }
    });

    document.getElementById('nextPage').addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        loadEntries();
      }
    });

    // Create entry
    document.getElementById('createBtn').addEventListener('click', () => {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Create Entry';
      entryForm.reset();
      document.getElementById('currentImage').textContent = '';
      entryModal.classList.remove('hidden');
      entryModal.classList.add('flex');
    });

    // Edit entry
    window.editEntry = async (id) => {
      try {
        const response = await fetch(`/api/entries/${id}`);
        const data = await response.json();

        if (!data.entry) {
          alert('Entry not found');
          return;
        }

        editingId = id;
        document.getElementById('modalTitle').textContent = 'Edit Entry';
        document.getElementById('entryId').value = id;
        document.getElementById('entryName').value = data.entry.name;
        document.getElementById('entryEmail').value = data.entry.email || '';
        document.getElementById('entryAddress').value = data.entry.address || '';
        document.getElementById('entryStatus').value = data.entry.current_status;
        document.getElementById('transactionStatus').value = data.entry.transaction_status || 'Pending';
        document.getElementById('entryAmount').value = data.entry.illustrative_amount || 0;
        document.getElementById('entryCurrency').value = data.entry.currency || 'USD';
        document.getElementById('entryFee').value = data.entry.illustrative_fee || 0;
        document.getElementById('entryRemarks').value = data.entry.remarks || '';
        document.getElementById('currentImage').textContent = data.entry.image_key ? `Current: ${data.entry.image_key}` : 'No image uploaded';

        entryModal.classList.remove('hidden');
        entryModal.classList.add('flex');
      } catch (error) {
        console.error('Error loading entry:', error);
        alert('Error loading entry');
      }
    };

    // Delete entry
    window.deleteEntry = async (id) => {
      if (!confirm('Are you sure you want to delete this entry?')) return;

      try {
        const response = await fetch(`/api/admin/entries/${id}`, { method: 'DELETE' });
        const data = await response.json();

        if (response.ok) {
          loadEntries();
        } else {
          alert(data.error || 'Failed to delete entry');
        }
      } catch (error) {
        console.error('Error deleting entry:', error);
        alert('Error deleting entry');
      }
    };

    // Save entry
    entryForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = entryForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      try {
        const formData = {
          name: document.getElementById('entryName').value,
          email: document.getElementById('entryEmail').value,
          address: document.getElementById('entryAddress').value,
          current_status: document.getElementById('entryStatus').value,
          transaction_status: document.getElementById('transactionStatus').value,
          illustrative_amount: parseFloat(document.getElementById('entryAmount').value) || 0,
          currency: document.getElementById('entryCurrency').value,
          illustrative_fee: parseFloat(document.getElementById('entryFee').value) || 0,
          remarks: document.getElementById('entryRemarks').value
        };

        // Handle image upload
        const imageInput = document.getElementById('entryImage');
        if (imageInput.files.length > 0) {
          const imageFormData = new FormData();
          imageFormData.append('file', imageInput.files[0]);

          const uploadResponse = await fetch('/api/admin/upload', {
            method: 'POST',
            body: imageFormData
          });

          const uploadData = await uploadResponse.json();
          if (uploadResponse.ok) {
            formData.image_key = uploadData.object_key;
          }
        }

        let response;
        if (editingId) {
          response = await fetch(`/api/admin/entries/${editingId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
        } else {
          response = await fetch('/api/admin/entries', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
        }

        const data = await response.json();

        if (response.ok) {
          entryModal.classList.add('hidden');
          entryModal.classList.remove('flex');
          loadEntries();
        } else {
          alert(data.error || 'Failed to save entry');
        }
      } catch (error) {
        console.error('Error saving entry:', error);
        alert('Error saving entry');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save';
      }
    });

    // Cancel modal
    document.getElementById('cancelBtn').addEventListener('click', () => {
      entryModal.classList.add('hidden');
      entryModal.classList.remove('flex');
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch('/api/admin/logout', { method: 'POST' });
        window.location.href = '/admin/login.html';
      } catch (error) {
        console.error('Logout error:', error);
      }
    });

    // Escape HTML helper
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize
    if (await checkAuth()) {
      loadEntries();
    }
  </script>
</body>
</html>
